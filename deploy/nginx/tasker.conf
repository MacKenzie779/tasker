# nginx site for Tasker, proxying to the Docker container from docker-compose.yml.
#
# Install:
#   1. Replace tasks.example.com with your domain (4 places).
#   2. Copy to /etc/nginx/conf.d/tasker.conf (or sites-available + symlink into sites-enabled).
#   3. Get a certificate, e.g.:  certbot certonly --webroot -w /var/www/certbot -d tasks.example.com
#   4. nginx -t && systemctl reload nginx
#
# This file is included inside the `http { }` block, which is where limit_req_zone must live.

# Slow down password guessing on the login form: 10 requests/minute per IP, short bursts allowed.
limit_req_zone $binary_remote_addr zone=tasker_login:10m rate=10r/m;

upstream tasker {
	# docker-compose publishes the app on 127.0.0.1:3000 only, so it is reachable just through nginx
	server 127.0.0.1:3000;
	keepalive 16;
}

# HTTP: answer ACME challenges, send everything else to HTTPS
server {
	listen 80;
	listen [::]:80;
	server_name tasks.example.com;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name tasks.example.com;

	ssl_certificate /etc/letsencrypt/live/tasks.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/tasks.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:tasker_ssl:10m;
	ssl_session_timeout 1d;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "same-origin" always;
	add_header X-Frame-Options "DENY" always;

	# sync batches from the app are small; the app itself rejects bodies over 512 KB
	client_max_body_size 1m;

	# adapter-node already serves precompressed (gzip/brotli) assets
	gzip off;

	# The app reads the original protocol and host from these headers
	# (PROTOCOL_HEADER / HOST_HEADER in docker-compose.yml). Without them, login is rejected
	# as a cross-site request and session cookies would not be marked Secure.
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $http_host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Real-IP $remote_addr;

	location / {
		proxy_pass http://tasker;
	}

	location = /login {
		limit_req zone=tasker_login burst=5 nodelay;
		limit_req_status 429;
		proxy_pass http://tasker;
	}

	# Must never be cached long, or phones keep running an old app version after an update.
	location = /service-worker.js {
		proxy_pass http://tasker;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-cache" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
	}

	# Calendar apps poll the feed; keep it out of access logs since the URL contains the secret token.
	location /ics/ {
		access_log off;
		proxy_pass http://tasker;
	}
}
